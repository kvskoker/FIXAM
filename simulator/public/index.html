<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIXAM WhatsApp Simulator</title>


<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="FIXAM WhatsApp Simulator" />
<link rel="manifest" href="/site.webmanifest" />

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <header class="topbar">
        <div class="topbar-left">
            <span class="topbar-icon">&#x1F4F1;</span>
            <div>
                <div class="topbar-title">FIXAM WhatsApp Simulator</div>
                <div class="topbar-sub">Local chatbot testing</div>
            </div>
        </div>
        <div class="topbar-right">
            <input type="text" id="phoneInput" class="phone-input" placeholder="23272123456">
            <button id="phoneApplyBtn" class="phone-btn" title="Switch the simulator to this number">Use number</button>
            <span id="status" class="status-dot" title="Checking...">&#x26AB;</span>
        </div>
    </header>

    <div class="chat" id="chat">
        <div id="messages" class="messages">
            <div class="empty-state">
                <div class="empty-icon">&#x1F4AC;</div>
                <div>Send a message to start testing the WhatsApp chatbot</div>
                <div class="empty-hint">Type a message or use the + button to upload images, audio, or share location</div>
            </div>
        </div>
    </div>

    <div class="input-bar">
        <div class="attach-wrapper">
            <button class="attach-btn" id="attachBtn" title="Attach">+</button>
            <div class="attach-menu" id="attachMenu">
                <button class="attach-item" data-action="image">&#x1F5BC; Photo / Image</button>
                <button class="attach-item" data-action="audio">&#x1F399; Voice Note / Audio</button>
                <button class="attach-item" data-action="video">&#x1F3A5; Video</button>
                <button class="attach-item" data-action="document">&#x1F4CE; Document</button>
                <button class="attach-item" data-action="location">&#x1F4CD; Location</button>
                <button class="attach-item" data-action="admin">&#x1F6E0; Admin Status Update</button>
                <button class="attach-item" data-action="new-user">&#x1F504; New User</button>
                <button class="attach-item" data-action="reset">&#x1F9F9; Reset Conversation</button>
            </div>
        </div>
        <input type="text" id="messageInput" class="msg-input" placeholder="Type a message..." autocomplete="off">
        <button id="sendBtn" class="send-btn" title="Send">&#x27A4;</button>
    </div>
</div>

<input type="file" id="fileInput" style="display:none" accept="image/*">
<input type="file" id="audioInput" style="display:none" accept="audio/*,.ogg,.opus,.mp3,.wav">
<input type="file" id="videoInput" style="display:none" accept="video/*">
<input type="file" id="documentInput" style="display:none">

<div id="locationModal" class="modal-overlay" style="display:none">
    <div class="modal-box">
        <h3>Send Location</h3>
        <div class="modal-field">
            <label>Latitude</label>
            <input type="text" id="locLat" class="input" value="8.484" placeholder="8.484">
        </div>
        <div class="modal-field">
            <label>Longitude</label>
            <input type="text" id="locLng" class="input" value="-13.234" placeholder="-13.234">
        </div>
        <div class="modal-btns">
            <button class="modal-btn cancel" id="locCancel">Cancel</button>
            <button class="modal-btn confirm" id="locSend">Send Location</button>
        </div>
    </div>
</div>

<div id="adminModal" class="modal-overlay" style="display:none">
    <div class="modal-box">
        <h3>Admin Status Update</h3>
        <div class="modal-field">
            <label>Issue</label>
            <select id="adminIssue" class="input"></select>
        </div>
        <div class="modal-field">
            <label>New status</label>
            <select id="adminStatus" class="input">
                <option value="acknowledged">Acknowledged</option>
                <option value="progress">In Progress</option>
                <option value="fixed">Fixed / Resolved</option>
                <option value="critical">High Priority</option>
            </select>
        </div>
        <div class="modal-field">
            <label>Resolution note (optional)</label>
            <input type="text" id="adminNote" class="input" placeholder="e.g. Road resurfaced on 12 Aug">
        </div>
        <div class="modal-btns">
            <button class="modal-btn cancel" id="adminCancel">Cancel</button>
            <button class="modal-btn confirm" id="adminSend">Send Update</button>
        </div>
    </div>
</div>

<script src="client.js"></script>
</body>
</html>
