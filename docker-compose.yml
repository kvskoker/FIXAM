services:
  postgres:
    # Stock postgres plus the openssl tool, so the entrypoint can generate a
    # certificate. Encrypts backend-to-database traffic; a deployment with its
    # own CA should mount its key and certificate over /var/lib/postgresql/tls.
    build: ./backend/db
    restart: unless-stopped
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
    environment:
      POSTGRES_USER: ${DB_USER:-fixam_db_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-F!x@m2025DJP}
      POSTGRES_DB: ${DB_NAME:-fixam_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql
      # Runs after the schema on a fresh volume. Existing deployments apply it
      # by hand -- it is written to be safe to re-run either way.
      - ./backend/db/migration_pilot_routing.sql:/docker-entrypoint-initdb.d/02-pilot-routing.sql
      - ./backend/db/migration_feedback_routing.sql:/docker-entrypoint-initdb.d/03-feedback-routing.sql
      - ./backend/db/migration_issue_closure.sql:/docker-entrypoint-initdb.d/04-issue-closure.sql
      - ./backend/db/migration_admin_audit.sql:/docker-entrypoint-initdb.d/05-admin-audit.sql
      - ./backend/db/migration_admin_otp.sql:/docker-entrypoint-initdb.d/06-admin-otp.sql
      - ./backend/db/migration_otp_verified.sql:/docker-entrypoint-initdb.d/07-otp-verified.sql
      - ./backend/db/migration_bot_flows.sql:/docker-entrypoint-initdb.d/08-bot-flows.sql
      - ./backend/db/migration_bot_flow_test_runs.sql:/docker-entrypoint-initdb.d/09-bot-flow-test-runs.sql
      - ./backend/db/migration_category_examples.sql:/docker-entrypoint-initdb.d/10-category-examples.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fixam_db_admin} -d ${DB_NAME:-fixam_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Geocoding, self-hosted.
  #
  # Turns "Wilkinson Road, Freetown" into coordinates and coordinates back into
  # a district and ward. Previously this went to the public OpenStreetMap
  # service, which asks for no more than one request per second and blocks
  # applications that exceed it -- a hard ceiling on how fast reports can be
  # processed, and a dependency on somebody else's uptime for a service the
  # pilot needs constantly.
  #
  # The import is a separate, one-off job: on first start with an empty volume
  # this container downloads the Sierra Leone extract and builds the search
  # database, which takes a while. The data then lives in the `nominatim-data`
  # volume and survives restarts, so it is never rebuilt unless that volume is
  # removed.
  #
  # While it is still importing, the platform keeps working: reports record
  # their coordinates, the address is left blank, and the hourly backfill fills
  # in the district and ward once this service answers.
  nominatim:
    image: mediagis/nominatim:4.4
    environment:
      # The country to import. Change both together -- the updates URL must
      # match the extract, or replication will fail.
      PBF_URL: ${NOMINATIM_PBF_URL:-https://download.geofabrik.de/africa/sierra-leone-latest.osm.pbf}
      REPLICATION_URL: ${NOMINATIM_REPLICATION_URL:-https://download.geofabrik.de/africa/sierra-leone-updates/}
      # Wikipedia importance data roughly doubles the import time and matters
      # for disambiguating world-famous places, which is not this use case.
      IMPORT_WIKIPEDIA: "false"
      IMPORT_US_POSTCODES: "false"
      IMPORT_GB_POSTCODES: "false"
      NOMINATIM_PASSWORD: ${NOMINATIM_DB_PASSWORD:-fixam_nominatim}
      # Threads for the import. More is faster up to the number of cores; too
      # many on a small host will starve everything else.
      THREADS: ${NOMINATIM_IMPORT_THREADS:-4}
    # The built database. Path is tied to the Postgres version inside the 4.4
    # image -- if the image tag changes, check this path against the new tag's
    # documentation before starting, or the import will silently begin again.
    volumes:
      - nominatim-data:/var/lib/postgresql/14/main
    # The import needs shared memory well beyond Docker's 64MB default and will
    # fail partway through without it.
    shm_size: ${NOMINATIM_SHM_SIZE:-1gb}
    ports:
      - "${NOMINATIM_PORT:-8080}:8080"
    healthcheck:
      # Reports ready only once the database is built and queryable, which is
      # what "healthy" needs to mean here.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Generous, because a first import is measured in tens of minutes and the
      # container should not be declared unhealthy while it is doing that.
      start_period: 60m
    restart: unless-stopped

  ai-engine:
    build: ./backend/ai_service
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER:-fixam_db_admin}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-fixam_db}
      DB_PASSWORD: ${DB_PASSWORD:-F!x@m2025DJP}
      DB_PORT: 5432
      DB_SSL: ${DB_SSL:-true}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      PARAKEET_MODEL: ${PARAKEET_MODEL:-nvidia/parakeet-tdt-0.6b-v3}
      MINOR_DETECTION_ENABLED: ${MINOR_DETECTION_ENABLED:-true}
      AGE_MODEL: ${AGE_MODEL:-prithivMLmods/Age-Classification-SigLIP2}
      MINOR_AGE_CONFIDENCE: ${MINOR_AGE_CONFIDENCE:-0.5}
      MINOR_FACE_CONFIDENCE: ${MINOR_FACE_CONFIDENCE:-0.3}
    # Published so the engine can be exercised directly (Postman, curl,
    # load tests). The backend reaches it over the compose network and does
    # not need this; drop the mapping to keep it internal-only.
    ports:
      - "${AI_ENGINE_PORT:-8000}:8000"
    # Model weights (~2.5 GB) live here. Without a volume they sit in the
    # container filesystem and are re-downloaded every single time the
    # service is recreated -- a rebuild, an env change, anything.
    volumes:
      - model-cache:/root/.cache
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-development}
      DB_USER: ${DB_USER:-fixam_db_admin}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-fixam_db}
      DB_PASSWORD: ${DB_PASSWORD:-F!x@m2025DJP}
      DB_PORT: 5432
      # Encrypt the connection to the database. Must match how postgres was
      # started; both are on by default here.
      DB_SSL: ${DB_SSL:-true}
      DB_SSL_CA: ${DB_SSL_CA:-}
      AI_SERVICE_URL: http://ai-engine:8000
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      PARAKEET_MODEL: ${PARAKEET_MODEL:-nvidia/parakeet-tdt-0.6b-v3}
      MINOR_DETECTION_ENABLED: ${MINOR_DETECTION_ENABLED:-true}
      # Signs admin session tokens. Without a stable value each restart
      # generates a new key and logs every admin out.
      SECRET: ${SECRET:-}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-12}
      # Second factor for portal sign-in. The administrator requests a code
      # from the bot over WhatsApp; set to false only to recover from a
      # lock-out, and set it back afterwards.
      ADMIN_2FA_ENABLED: ${ADMIN_2FA_ENABLED:-true}
      ADMIN_OTP_TTL_MINUTES: ${ADMIN_OTP_TTL_MINUTES:-10}
      ADMIN_OTP_MAX_PER_HOUR: ${ADMIN_OTP_MAX_PER_HOUR:-10}
      SUPER_ADMIN_PHONE: ${SUPER_ADMIN_PHONE:-23200000000}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-Adm1n@Fixam}
      BOT_PHONE_NUMBER: ${BOT_PHONE_NUMBER:-23233788736}
      # Duplicate detection: how close, and how recent, two reports must be to
      # be treated as the same problem. Tunable because the right answer differs
      # between a dense market and a rural road.
      DUPLICATE_RADIUS_METERS: ${DUPLICATE_RADIUS_METERS:-100}
      DUPLICATE_WINDOW_DAYS: ${DUPLICATE_WINDOW_DAYS:-7}
      # Geocoding. The public Nominatim service has a usage policy that a live
      # civic platform will exceed; point this at your own instance before the
      # pilot grows.
      # Our own instance, so there is no per-second limit to respect. The
      # throttle switches itself back on if this is pointed at a public host.
      NOMINATIM_URL: ${NOMINATIM_URL:-http://nominatim:8080}
      NOMINATIM_TIMEOUT_MS: ${NOMINATIM_TIMEOUT_MS:-8000}
      NOMINATIM_MIN_INTERVAL_MS: ${NOMINATIM_MIN_INTERVAL_MS:-}
      # Forces the super admin password back to SUPER_ADMIN_PASSWORD on boot.
      # Recovery only -- leave unset so a changed password stays changed.
      SUPER_ADMIN_RESET_PASSWORD: ${SUPER_ADMIN_RESET_PASSWORD:-}
      DEV_MODE: ${DEV_MODE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost,http://localhost:80}
      # Public address citizens see in ticket/privacy links. The frontend
      # container publishes on port 80, so that -- not the 3000 used by the
      # non-Docker `serve` setup -- is the right default here.
      FIXAM_BASE_URL: ${FIXAM_BASE_URL:-http://localhost}
      FIXAM_COUNTRY_CODE: ${FIXAM_COUNTRY_CODE:-SL}
      FIXAM_CONTACT_EMAIL: ${FIXAM_CONTACT_EMAIL:-privacy@fixam.sl}
      FIXAM_WEBSITE: ${FIXAM_WEBSITE:-https://fixam.sl}
      UPLOADS_DIR: /data/uploads
      # Retention windows, in days. Defaults match the published privacy
      # policy; lowering them tightens it, raising them requires the policy
      # to be updated too.
      MESSAGE_LOG_RETENTION_DAYS: ${MESSAGE_LOG_RETENTION_DAYS:-90}
      CONVERSATION_STATE_RETENTION_DAYS: ${CONVERSATION_STATE_RETENTION_DAYS:-7}
      PENDING_CONSENT_RETENTION_DAYS: ${PENDING_CONSENT_RETENTION_DAYS:-30}
      ADMIN_AUDIT_RETENTION_DAYS: ${ADMIN_AUDIT_RETENTION_DAYS:-730}
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
      SIMULATOR_URL: ${SIMULATOR_URL:-http://simulator:4001}
      SIMULATOR_PORT: 4001
      SIMULATOR_PHONE: ${SIMULATOR_PHONE:-23272123456}
    volumes:
      - uploads-data:/data/uploads
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-engine:
        condition: service_started

  simulator:
    build:
      context: .
      dockerfile: ./simulator/Dockerfile
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-development}
      DB_USER: ${DB_USER:-fixam_db_admin}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-fixam_db}
      DB_PASSWORD: ${DB_PASSWORD:-F!x@m2025DJP}
      DB_PORT: 5432
      DB_SSL: ${DB_SSL:-true}
      DB_SSL_CA: ${DB_SSL_CA:-}
      SIMULATOR_PORT: 4001
      SIMULATOR_PHONE: ${SIMULATOR_PHONE:-23272123456}
      SIMULATOR_BACKEND_URL: http://backend:5000
      SIMULATOR_ENABLED: "true"
      BOT_PHONE_NUMBER: ${BOT_PHONE_NUMBER:-23233788736}
      # Duplicate detection: how close, and how recent, two reports must be to
      # be treated as the same problem. Tunable because the right answer differs
      # between a dense market and a rural road.
      DUPLICATE_RADIUS_METERS: ${DUPLICATE_RADIUS_METERS:-100}
      DUPLICATE_WINDOW_DAYS: ${DUPLICATE_WINDOW_DAYS:-7}
      # Geocoding. The public Nominatim service has a usage policy that a live
      # civic platform will exceed; point this at your own instance before the
      # pilot grows.
      # Our own instance, so there is no per-second limit to respect. The
      # throttle switches itself back on if this is pointed at a public host.
      NOMINATIM_URL: ${NOMINATIM_URL:-http://nominatim:8080}
      NOMINATIM_TIMEOUT_MS: ${NOMINATIM_TIMEOUT_MS:-8000}
      NOMINATIM_MIN_INTERVAL_MS: ${NOMINATIM_MIN_INTERVAL_MS:-}
      # Forces the super admin password back to SUPER_ADMIN_PASSWORD on boot.
      # Recovery only -- leave unset so a changed password stays changed.
      SUPER_ADMIN_RESET_PASSWORD: ${SUPER_ADMIN_RESET_PASSWORD:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      AI_SERVICE_URL: http://ai-engine:8000
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      PARAKEET_MODEL: ${PARAKEET_MODEL:-nvidia/parakeet-tdt-0.6b-v3}
      MINOR_DETECTION_ENABLED: ${MINOR_DETECTION_ENABLED:-true}
      # Signs admin session tokens. Without a stable value each restart
      # generates a new key and logs every admin out.
      SECRET: ${SECRET:-}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-12}
      # Second factor for portal sign-in. The administrator requests a code
      # from the bot over WhatsApp; set to false only to recover from a
      # lock-out, and set it back afterwards.
      ADMIN_2FA_ENABLED: ${ADMIN_2FA_ENABLED:-true}
      ADMIN_OTP_TTL_MINUTES: ${ADMIN_OTP_TTL_MINUTES:-10}
      ADMIN_OTP_MAX_PER_HOUR: ${ADMIN_OTP_MAX_PER_HOUR:-10}
      SUPER_ADMIN_PHONE: ${SUPER_ADMIN_PHONE:-23200000000}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-Adm1n@Fixam}
      # The simulator runs the handler in-process, so it builds ticket links
      # itself -- without this it would fall back to the hosted demo URL.
      FIXAM_BASE_URL: ${FIXAM_BASE_URL:-http://localhost}
      FIXAM_COUNTRY_CODE: ${FIXAM_COUNTRY_CODE:-SL}
      FIXAM_CONTACT_EMAIL: ${FIXAM_CONTACT_EMAIL:-privacy@fixam.sl}
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads-data:/data/uploads
    ports:
      - "${SIMULATOR_PORT:-4001}:4001"
    restart: unless-stopped
    profiles:
      - simulator
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NGINX_HOST: localhost
      NGINX_PORT: "80"
    volumes:
      - uploads-data:/data/uploads
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  # The built geocoding database. Removing this means a full re-import.
  nominatim-data:
  uploads-data:
  model-cache:
