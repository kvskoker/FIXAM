# Preserve the scheme the *browser* used, not the scheme of the hop into this
# container.
#
# Behind a TLS-terminating proxy the connection here is plain HTTP on 8080, so
# `$scheme` is "http". Passing that on overwrites the "https" the outer proxy
# set, and backend/server.js -- which redirects to HTTPS whenever
# X-Forwarded-Proto is not "https" -- sends the browser into a redirect loop
# that surfaces as a bare NetworkError with no useful message.
#
# So: forward an inbound value untouched, and fall back to $scheme only when
# there is no outer proxy, which is the local development case.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Health check, proxied so external monitoring can reach it. Without this
    # location it falls through to the static handler and returns 404, which
    # looks exactly like a broken backend.
    location = /healthz {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # A health check that hangs is a health check that alerts late.
        proxy_read_timeout 10s;
        access_log off;
    }

    location /webhook {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /uploads/ {
        alias /data/uploads/;
    }

    # The app ships unversioned filenames (js/admin_issues.js), so without an
    # explicit policy browsers apply heuristic caching and keep serving the
    # previous deploy's script for hours. "no-cache" still allows a cached copy
    # but forces revalidation against the ETag, so a redeploy takes effect on
    # the next load while unchanged files stay a cheap 304.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The pages have the same problem as the scripts and for the same reason:
    # fixed filenames, no versioning, so a browser left to its own heuristics
    # keeps serving the previous deploy's markup -- which then runs against the
    # new scripts and fails in ways that look like bugs in the feature rather
    # than a stale page.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        # Pages are requested without the .html suffix, and nginx matches
        # locations on the URI rather than on the file it resolves to -- so the
        # rule above never sees /admin/bot-flows. This is the one that matters.
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    # Both spellings, because a browser produces both. "/admin" is what people
    # type and what gets shared; "/admin/" is what a browser sends after
    # following a link that ends in a slash, and what some clients normalise a
    # bare directory path into.
    #
    # Without the second rule, "/admin/" falls through to the static handler,
    # which resolves it to the real /admin directory. There is no index.html in
    # there -- the pages are overview.html, issues.html and so on -- so nginx
    # refuses to list the directory and returns 403. To a visitor that reads as
    # "you are not allowed in", which is both wrong and alarming, and the fix
    # they stumble on is to delete a character from the URL.
    location = /admin {
        return 301 /admin/overview;
    }

    location = /admin/ {
        return 301 /admin/overview;
    }

    # Anything genuinely missing gets the styled page rather than nginx's
    # default, which is an unbranded white page that looks like the site itself
    # is broken.
    error_page 404 /404.html;

    # A directory with no index also produces 403, and any path that happens to
    # collide with a real directory would leak that fact. Serving 404 instead
    # says the same thing to a visitor and less to somebody probing the layout.
    # The =404 matters: a bare "error_page 403 /404.html" would serve this
    # page while still reporting 403, and "= /404.html" would report 200.
    # Neither is honest about what happened.
    error_page 403 =404 /404.html;

    # internal: reachable as an error target, but not directly. Without it,
    # /404.html is a page that returns 200, which search engines will index as
    # a real page.
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    # The About page moved to the project's main site, which is the one place
    # it can be kept current. Redirected rather than deleted outright: the old
    # URL is in sent messages, bookmarks and any link shared during the demo,
    # and a 404 tells a visitor nothing about where the content went.
    #
    # 302, not 301 — a permanent redirect is cached by browsers indefinitely
    # and would be painful to undo if the page ever comes back.
    location = /about {
        return 302 https://fixam.sl/;
    }
}
