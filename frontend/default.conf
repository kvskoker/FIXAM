server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /webhook {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /data/uploads/;
    }

    # The app ships unversioned filenames (js/admin_issues.js), so without an
    # explicit policy browsers apply heuristic caching and keep serving the
    # previous deploy's script for hours. "no-cache" still allows a cached copy
    # but forces revalidation against the ETag, so a redeploy takes effect on
    # the next load while unchanged files stay a cheap 304.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The pages have the same problem as the scripts and for the same reason:
    # fixed filenames, no versioning, so a browser left to its own heuristics
    # keeps serving the previous deploy's markup -- which then runs against the
    # new scripts and fails in ways that look like bugs in the feature rather
    # than a stale page.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        # Pages are requested without the .html suffix, and nginx matches
        # locations on the URI rather than on the file it resolves to -- so the
        # rule above never sees /admin/bot-flows. This is the one that matters.
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    location = /admin {
        return 301 /admin/overview;
    }
}
