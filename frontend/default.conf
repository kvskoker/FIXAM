# Preserve the scheme the *browser* used, not the scheme of the hop into this
# container.
#
# Behind a TLS-terminating proxy the connection here is plain HTTP on 8080, so
# `$scheme` is "http". Passing that on overwrites the "https" the outer proxy
# set, and backend/server.js -- which redirects to HTTPS whenever
# X-Forwarded-Proto is not "https" -- sends the browser into a redirect loop
# that surfaces as a bare NetworkError with no useful message.
#
# So: forward an inbound value untouched, and fall back to $scheme only when
# there is no outer proxy, which is the local development case.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Health check, proxied so external monitoring can reach it. Without this
    # location it falls through to the static handler and returns 404, which
    # looks exactly like a broken backend.
    location = /healthz {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # A health check that hangs is a health check that alerts late.
        proxy_read_timeout 10s;
        access_log off;
    }

    location /webhook {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /uploads/ {
        alias /data/uploads/;
    }

    # The app ships unversioned filenames (js/admin_issues.js), so without an
    # explicit policy browsers apply heuristic caching and keep serving the
    # previous deploy's script for hours. "no-cache" still allows a cached copy
    # but forces revalidation against the ETag, so a redeploy takes effect on
    # the next load while unchanged files stay a cheap 304.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The pages have the same problem as the scripts and for the same reason:
    # fixed filenames, no versioning, so a browser left to its own heuristics
    # keeps serving the previous deploy's markup -- which then runs against the
    # new scripts and fails in ways that look like bugs in the feature rather
    # than a stale page.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        # Pages are requested without the .html suffix, and nginx matches
        # locations on the URI rather than on the file it resolves to -- so the
        # rule above never sees /admin/bot-flows. This is the one that matters.
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    location = /admin {
        return 301 /admin/overview;
    }
}
